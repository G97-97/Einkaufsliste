name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: APK bauen
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Als Download veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk einkaufsliste.apk
          gh release delete app --yes --cleanup-tag || true
          gh release create app einkaufsliste.apk --title "Einkaufsliste (Version ${{ github.run_number }})" --notes "Auf dem Handy öffnen und installieren." --latest
